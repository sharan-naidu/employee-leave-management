apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: employee-leave-cluster
  region: us-east-1

managedNodeGroups:
  - name: employee-leave-nodes
    instanceType: t3.medium
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 20
    privateNetworking: false
    labels:
      role: application
    tags:
      project: employee-leave-management

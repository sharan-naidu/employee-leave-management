replicaCount: 2

image:
  repository: sharanketon/employee-leave-management
  tag: v1.0.0
  pullPolicy: IfNotPresent

container:
  port: 8000

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: sharan.kubeace.in
  clusterIssuer: letsencrypt-prod
  tlsSecretName: employee-leave-tls

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
